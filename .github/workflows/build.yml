name: Build PKG

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  pkg:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install host packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libgmp-dev libssl-dev python3-dev python3-setuptools libfreetype-dev

      - name: Cache toolchain
        id: cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/ps3
          key: ps3dev-2020-08-31-v1-${{ hashFiles('tools/ci/setup-toolchain.sh') }}

      - name: Set up PSL1GHT toolchain
        run: tools/ci/setup-toolchain.sh "${{ runner.temp }}/ps3"

      - name: Build
        run: |
          export PS3DEV="${{ runner.temp }}/ps3/ps3dev"
          export PSL1GHT="$PS3DEV"
          export PATH="$PS3DEV/bin:$PS3DEV/ppu/bin:$PATH"
          make pkg

      - name: Check the PC preview still builds
        run: tools/host/build.sh

      - name: Upload PKG
        uses: actions/upload-artifact@v4
        with:
          name: SNES9x-PS5-${{ github.sha }}
          path: snes9x-ps5.pkg
          if-no-files-found: error
